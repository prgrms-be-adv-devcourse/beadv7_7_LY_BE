plugins {
    id 'java-library'   // Boot 플러그인 없음. 이 모듈은 '부품'이지 '앱'이 아니다.
}

dependencies {
    // GlobalExceptionHandler(@RestControllerAdvice)와 ApiResponse(Jackson)가 웹 스택을 쓴다.
    // api: common을 쓰는 모듈에게도 이 의존성이 그대로 전파된다.
    api 'org.springframework.boot:spring-boot-starter-webmvc'
    api 'org.springframework.boot:spring-boot-starter-data-jpa'

    // AWS KMS — implementation으로 둬서 AWS SDK 타입이 common을 쓰는 서비스의 컴파일 클래스패스에
    // 노출되지 않게 한다(런타임에는 그대로 전이됨). 다른 모듈은 KmsEncryptor 인터페이스만 본다.
    implementation 'software.amazon.awssdk:kms'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

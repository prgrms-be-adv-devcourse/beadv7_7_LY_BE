  cleanup-secret-files:
    needs: [ gateway-service-deploy, member-service-deploy, product-service-deploy, auction-service-deploy, fulfillment-service-deploy, pointwallet-service-deploy ]
    if: |
      always() &&
      (needs.gateway-service-deploy.result != 'skipped'
      || needs.member-service-deploy.result != 'skipped'
      || needs.product-service-deploy.result != 'skipped'
      || needs.auction-service-deploy.result != 'skipped'
      || needs.fulfillment-service-deploy.result != 'skipped'
      || needs.pointwallet-service-deploy.result != 'skipped')
    runs-on: groovid-app-ec2-runner
    steps:
      - name: Remove secret files from EC2 host
        run: |
          cd ~/project
          sudo rm -rf .env .gateway-service-secret .member-service-secret .product-service-secret .auction-service-secret .fulfillment-service-secret .pointwallet-service-secret
          echo "🧹 민감 정보 파일(.env, secret)이 깔끔하게 정리되었습니다."

  # 이미지 빌드 / 배포 잡은 전부 continue-on-error다 - 한 서비스가 실패해도
  # 나머지 서비스의 배포와 시크릿 파일 정리는 끝까지 진행돼야 하기 때문이다.
  # 그 대신 최종 성패는 이 잡이 판정한다. 이 잡이 없으면 컨테이너가 뜨지 않아도
  # 워크플로가 초록불로 끝난다.
  report-deploy-result:
    needs: [ gateway-service-image-build, member-service-image-build, product-service-image-build,
             auction-service-image-build, fulfillment-service-image-build, pointwallet-service-image-build,
             gateway-service-deploy, member-service-deploy, product-service-deploy,
             auction-service-deploy, fulfillment-service-deploy, pointwallet-service-deploy ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarize deploy results
        run: |
          FAILED=0

          # 배포 라벨이 안 붙은 서비스는 두 결과가 모두 빈 값이다(잡이 skip됨).
          report() {
            SERVICE=$1
            BUILD_RESULT=$2
            DEPLOY_RESULT=$3

            if [[ -z "$BUILD_RESULT" ]]; then
              echo "⏭️  $SERVICE - 배포 대상 아님"
            elif [[ "$BUILD_RESULT" != "success" ]]; then
              echo "❌ $SERVICE - 이미지 빌드 실패"
              FAILED=1
            elif [[ "$DEPLOY_RESULT" == "success" ]]; then
              echo "✅ $SERVICE - 배포 성공"
            else
              echo "❌ $SERVICE - 배포 실패 (헬스 체크 미통과)"
              FAILED=1
            fi
          }

          report "gateway-service" "${{ needs.gateway-service-image-build.outputs.gateway_service_image_build_result }}" "${{ needs.gateway-service-deploy.outputs.gateway_service_deploy_result }}"
          report "member-service" "${{ needs.member-service-image-build.outputs.member_service_image_build_result }}" "${{ needs.member-service-deploy.outputs.member_service_deploy_result }}"
          report "product-service" "${{ needs.product-service-image-build.outputs.product_service_image_build_result }}" "${{ needs.product-service-deploy.outputs.product_service_deploy_result }}"
          report "auction-service" "${{ needs.auction-service-image-build.outputs.auction_service_image_build_result }}" "${{ needs.auction-service-deploy.outputs.auction_service_deploy_result }}"
          report "fulfillment-service" "${{ needs.fulfillment-service-image-build.outputs.fulfillment_service_image_build_result }}" "${{ needs.fulfillment-service-deploy.outputs.fulfillment_service_deploy_result }}"
          report "pointwallet-service" "${{ needs.pointwallet-service-image-build.outputs.pointwallet_service_image_build_result }}" "${{ needs.pointwallet-service-deploy.outputs.pointwallet_service_deploy_result }}"

          if [[ $FAILED == 1 ]]; then
            echo "💥 실패한 서비스가 있습니다. 위 목록과 각 잡의 로그를 확인해주세요."
            exit 1
          fi

          echo "🍺 배포 작업이 모두 정상적으로 완료되었습니다."

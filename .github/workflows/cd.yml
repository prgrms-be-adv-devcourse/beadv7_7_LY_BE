name: LP Auction CD

on:
  pull_request:
    types: [ closed ]
    branches: [ dev ]

# 같은 브랜치의 배포가 겹치지 않게 직렬화한다.
# 배포 잡들은 EC2의 같은 디렉터리(~/project)에서 .env와 시크릿 파일을 쓰고
# 같은 컨테이너에 docker-compose up을 걸기 때문에, 이전 배포가 도는 중에
# 새 배포가 시작되면 서로의 파일을 덮어쓴다.
# cancel-in-progress는 false다 - 배포 도중에 취소하면 컨테이너가 중간 상태로 남는다.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

# 6개 서비스의 이미지 정보. 어느 배포 잡이든 .env에 6개를 전부 써야 하므로
# (부분만 쓰면 나머지 서비스의 이미지 변수가 빈 값이 된다) 잡이 아니라
# 워크플로 레벨에 둔다. .github/actions/prepare-deploy-files가 이 값을 읽는다.
env:
  GATEWAY_SERVICE_IMAGE_REPOSITORY: ${{ secrets.GATEWAY_SERVICE_GHCR_IMAGE }}
  MEMBER_SERVICE_IMAGE_REPOSITORY: ${{ secrets.MEMBER_SERVICE_GHCR_IMAGE }}
  PRODUCT_SERVICE_IMAGE_REPOSITORY: ${{ secrets.PRODUCT_SERVICE_GHCR_IMAGE }}
  AUCTION_SERVICE_IMAGE_REPOSITORY: ${{ secrets.AUCTION_SERVICE_GHCR_IMAGE }}
  FULFILLMENT_SERVICE_IMAGE_REPOSITORY: ${{ secrets.FULFILLMENT_SERVICE_GHCR_IMAGE }}
  POINTWALLET_SERVICE_IMAGE_REPOSITORY: ${{ secrets.POINTWALLET_SERVICE_GHCR_IMAGE }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  check-deploy-condition:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    outputs:
      gateway_service_deploy: ${{ steps.check-deploy-label.outputs.gateway_service_deploy }}
      member_service_deploy: ${{ steps.check-deploy-label.outputs.member_service_deploy }}
      product_service_deploy: ${{ steps.check-deploy-label.outputs.product_service_deploy }}
      auction_service_deploy: ${{ steps.check-deploy-label.outputs.auction_service_deploy }}
      fulfillment_service_deploy: ${{ steps.check-deploy-label.outputs.fulfillment_service_deploy }}
      pointwallet_service_deploy: ${{ steps.check-deploy-label.outputs.pointwallet_service_deploy }}
    steps:
      - name: Check deploy label
        id: check-deploy-label
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });
            
            const hasGatewayServiceDeployLabel = pr.data.labels.map(label => label.name).includes("gateway-service-deploy");
            core.setOutput("gateway_service_deploy", hasGatewayServiceDeployLabel ? "true" : "false");
            
            const hasMemberServiceDeployLabel = pr.data.labels.map(label => label.name).includes("member-service-deploy");
            core.setOutput("member_service_deploy", hasMemberServiceDeployLabel ? "true" : "false");
            
            const hasProductServiceDeployLabel = pr.data.labels.map(label => label.name).includes("product-service-deploy");
            core.setOutput("product_service_deploy", hasProductServiceDeployLabel ? "true" : "false");

            const hasAuctionServiceDeployLabel = pr.data.labels.map(label => label.name).includes("auction-service-deploy");
            core.setOutput("auction_service_deploy", hasAuctionServiceDeployLabel ? "true" : "false");

            const hasFulfillmentServiceDeployLabel = pr.data.labels.map(label => label.name).includes("fulfillment-service-deploy");
            core.setOutput("fulfillment_service_deploy", hasFulfillmentServiceDeployLabel ? "true" : "false");

            const hasPointwalletServiceDeployLabel = pr.data.labels.map(label => label.name).includes("pointwallet-service-deploy");
            core.setOutput("pointwallet_service_deploy", hasPointwalletServiceDeployLabel ? "true" : "false");

      - name: Explain deploy decision
        run: |
          # gateway-service 배포 여부 체크
          if [[ "${{ steps.check-deploy-label.outputs.gateway_service_deploy }}" == "true" ]]; then
            echo "🚚 gateway-service 배포 작업을 진행합니다."
          else
            echo "✋ gateway-service 배포 작업을 진행하지 않습니다."
          fi
          
          # member-service 배포 여부 체크
          if [[ "${{ steps.check-deploy-label.outputs.member_service_deploy }}" == "true" ]]; then
            echo "🚚 member-service 배포 작업을 진행합니다."
          else
            echo "✋ member-service 배포 작업을 진행하지 않습니다."
          fi
          
          # product-service 배포 여부 체크
          if [[ "${{ steps.check-deploy-label.outputs.product_service_deploy }}" == "true" ]]; then
            echo "🚚 product-service 배포 작업을 진행합니다."
          else
            echo "✋ product-service 배포 작업을 진행하지 않습니다."
          fi

          # auction-service 배포 여부 체크
          if [[ "${{ steps.check-deploy-label.outputs.auction_service_deploy }}" == "true" ]]; then
            echo "🚚 auction-service 배포 작업을 진행합니다."
          else
            echo "✋ auction-service 배포 작업을 진행하지 않습니다."
          fi

          # fulfillment-service 배포 여부 체크
          if [[ "${{ steps.check-deploy-label.outputs.fulfillment_service_deploy }}" == "true" ]]; then
            echo "🚚 fulfillment-service 배포 작업을 진행합니다."
          else
            echo "✋ fulfillment-service 배포 작업을 진행하지 않습니다."
          fi

          # pointwallet-service 배포 여부 체크
          if [[ "${{ steps.check-deploy-label.outputs.pointwallet_service_deploy }}" == "true" ]]; then
            echo "🚚 pointwallet-service 배포 작업을 진행합니다."
          else
            echo "✋ pointwallet-service 배포 작업을 진행하지 않습니다."
          fi

  gateway-service-image-build:
    needs: [ check-deploy-condition ]
    if: needs.check-deploy-condition.outputs.gateway_service_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      gateway_service_image_build_result: ${{ steps.image-build-result.outputs.gateway_service_image_build_result }}
    continue-on-error: true
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7

      - name: Set up jdk
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew\

      - name: Build with gradle
        run: ./gradlew :gateway-service:bootJar -Pspring.profiles.active=prod --info

      - name: Login to Github Container Registry
        uses: docker/login-action@v3.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Docker build & push
        id: docker-build-and-push
        working-directory: ./gateway-service
        run: |
          docker build --no-cache -f docker/Dockerfile --build-arg SPRINGBOOT_APP_PROFILE=prod --platform linux/amd64 -t ${{ secrets.GATEWAY_SERVICE_GHCR_IMAGE }}:${{ github.sha }} .
          docker push ${{ secrets.GATEWAY_SERVICE_GHCR_IMAGE }}:${{ github.sha }}

      - name: Set Image build result
        if: always()
        id: image-build-result
        run: |
          echo "gateway_service_image_build_result=fail" >> $GITHUB_OUTPUT
          if [[ ${{ steps.docker-build-and-push.outcome }} == "success" ]]; then
          echo "gateway_service_image_build_result=success" >> $GITHUB_OUTPUT
          fi

  member-service-image-build:
    needs: [ check-deploy-condition ]
    if: needs.check-deploy-condition.outputs.member_service_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      member_service_image_build_result: ${{ steps.image-build-result.outputs.member_service_image_build_result }}
    continue-on-error: true
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7

      - name: Set up jdk
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew\

      - name: Build with gradle
        run: ./gradlew :member-service:bootJar -Pspring.profiles.active=prod --info

      - name: Login to Github Container Registry
        uses: docker/login-action@v3.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Docker build & push
        id: docker-build-and-push
        working-directory: ./member-service
        run: |
          docker build --no-cache -f docker/Dockerfile --build-arg SPRINGBOOT_APP_PROFILE=prod --platform linux/amd64 -t ${{ secrets.MEMBER_SERVICE_GHCR_IMAGE }}:${{ github.sha }} .
          docker push ${{ secrets.MEMBER_SERVICE_GHCR_IMAGE }}:${{ github.sha }}

      - name: Set Image build result
        if: always()
        id: image-build-result
        run: |
          echo "member_service_image_build_result=fail" >> $GITHUB_OUTPUT
          if [[ ${{ steps.docker-build-and-push.outcome }} == "success" ]]; then
          echo "member_service_image_build_result=success" >> $GITHUB_OUTPUT
          fi

  product-service-image-build:
    needs: [ check-deploy-condition ]
    if: needs.check-deploy-condition.outputs.product_service_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      product_service_image_build_result: ${{ steps.image-build-result.outputs.product_service_image_build_result }}
    continue-on-error: true
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7

      - name: Set up jdk
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew\

      - name: Build with gradle
        run: ./gradlew :product-service:bootJar -Pspring.profiles.active=prod --info

      - name: Login to Github Container Registry
        uses: docker/login-action@v3.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Docker build & push
        id: docker-build-and-push
        working-directory: ./product-service
        run: |
          docker build --no-cache -f docker/Dockerfile --build-arg SPRINGBOOT_APP_PROFILE=prod --platform linux/amd64 -t ${{ secrets.PRODUCT_SERVICE_GHCR_IMAGE }}:${{ github.sha }} .
          docker push ${{ secrets.PRODUCT_SERVICE_GHCR_IMAGE }}:${{ github.sha }}

      - name: Set Image build result
        if: always()
        id: image-build-result
        run: |
          echo "product_service_image_build_result=fail" >> $GITHUB_OUTPUT
          if [[ ${{ steps.docker-build-and-push.outcome }} == "success" ]]; then
          echo "product_service_image_build_result=success" >> $GITHUB_OUTPUT
          fi

  auction-service-image-build:
    needs: [ check-deploy-condition ]
    if: needs.check-deploy-condition.outputs.auction_service_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      auction_service_image_build_result: ${{ steps.image-build-result.outputs.auction_service_image_build_result }}
    continue-on-error: true
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7

      - name: Set up jdk
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with gradle
        run: ./gradlew :auction-service:bootJar -Pspring.profiles.active=prod --info

      - name: Login to Github Container Registry
        uses: docker/login-action@v3.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Docker build & push
        id: docker-build-and-push
        working-directory: ./auction-service
        run: |
          docker build --no-cache -f docker/Dockerfile --build-arg SPRINGBOOT_APP_PROFILE=prod --platform linux/amd64 -t ${{ secrets.AUCTION_SERVICE_GHCR_IMAGE }}:${{ github.sha }} .
          docker push ${{ secrets.AUCTION_SERVICE_GHCR_IMAGE }}:${{ github.sha }}

      - name: Set Image build result
        if: always()
        id: image-build-result
        run: |
          echo "auction_service_image_build_result=fail" >> $GITHUB_OUTPUT
          if [[ ${{ steps.docker-build-and-push.outcome }} == "success" ]]; then
          echo "auction_service_image_build_result=success" >> $GITHUB_OUTPUT
          fi

  fulfillment-service-image-build:
    needs: [ check-deploy-condition ]
    if: needs.check-deploy-condition.outputs.fulfillment_service_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      fulfillment_service_image_build_result: ${{ steps.image-build-result.outputs.fulfillment_service_image_build_result }}
    continue-on-error: true
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7

      - name: Set up jdk
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with gradle
        run: ./gradlew :fulfillment-service:bootJar -Pspring.profiles.active=prod --info

      - name: Login to Github Container Registry
        uses: docker/login-action@v3.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Docker build & push
        id: docker-build-and-push
        working-directory: ./fulfillment-service
        run: |
          docker build --no-cache -f docker/Dockerfile --build-arg SPRINGBOOT_APP_PROFILE=prod --platform linux/amd64 -t ${{ secrets.FULFILLMENT_SERVICE_GHCR_IMAGE }}:${{ github.sha }} .
          docker push ${{ secrets.FULFILLMENT_SERVICE_GHCR_IMAGE }}:${{ github.sha }}

      - name: Set Image build result
        if: always()
        id: image-build-result
        run: |
          echo "fulfillment_service_image_build_result=fail" >> $GITHUB_OUTPUT
          if [[ ${{ steps.docker-build-and-push.outcome }} == "success" ]]; then
          echo "fulfillment_service_image_build_result=success" >> $GITHUB_OUTPUT
          fi

  pointwallet-service-image-build:
    needs: [ check-deploy-condition ]
    if: needs.check-deploy-condition.outputs.pointwallet_service_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      pointwallet_service_image_build_result: ${{ steps.image-build-result.outputs.pointwallet_service_image_build_result }}
    continue-on-error: true
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7

      - name: Set up jdk
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with gradle
        run: ./gradlew :pointwallet-service:bootJar -Pspring.profiles.active=prod --info

      - name: Login to Github Container Registry
        uses: docker/login-action@v3.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Docker build & push
        id: docker-build-and-push
        working-directory: ./pointwallet-service
        run: |
          docker build --no-cache -f docker/Dockerfile --build-arg SPRINGBOOT_APP_PROFILE=prod --platform linux/amd64 -t ${{ secrets.POINTWALLET_SERVICE_GHCR_IMAGE }}:${{ github.sha }} .
          docker push ${{ secrets.POINTWALLET_SERVICE_GHCR_IMAGE }}:${{ github.sha }}

      - name: Set Image build result
        if: always()
        id: image-build-result
        run: |
          echo "pointwallet_service_image_build_result=fail" >> $GITHUB_OUTPUT
          if [[ ${{ steps.docker-build-and-push.outcome }} == "success" ]]; then
          echo "pointwallet_service_image_build_result=success" >> $GITHUB_OUTPUT
          fi

  gateway-service-deploy:
    needs: [ gateway-service-image-build ]
    if: needs.gateway-service-image-build.outputs.gateway_service_image_build_result == 'success'
    runs-on: groovid-app-ec2-runner
    continue-on-error: true
    outputs:
      gateway_service_deploy_result: ${{ steps.deploy-result.outputs.gateway_service_deploy_result }}
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7

      - name: Login to Github Container Registry
        uses: docker/login-action@v3.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Create secret file
        uses: ./.github/actions/prepare-deploy-files
        with:
          service: gateway-service
          secret-body: |
            PORT_NUMBER=8080

            PRODUCT_SERVICE_URI=${{ secrets.PRODUCT_SERVICE_BASE_URL }}
            MEMBER_SERVICE_URI=${{ secrets.MEMBER_SERVICE_BASE_URL }}
            POINTWALLET_SERVICE_URI=${{ secrets.POINTWALLET_SERVICE_BASE_URL }}
            FULFILLMENT_SERVICE_URI=${{ secrets.FULFILLMENT_SERVICE_BASE_URL }}
            AUCTION_SERVICE_URI=${{ secrets.AUCTION_SERVICE_BASE_URL }}

            ACCESS_TOKEN_SECRET_KEY=${{ secrets.ACCESS_TOKEN_SECRET_KEY }}

      - name: Start new server application
        id: start-new-server-application
        run: |
          cd ~/project
          sudo docker-compose stop gateway-service || true
          sudo docker-compose rm -f gateway-service || true
          sudo docker-compose up -d gateway-service
          
          echo "🔍 gateway-service 헬스 체크 확인 중..."
          for i in {1..20}; do
            response=$(curl -s http://localhost:8080/gateway-service/actuator/health || true)
            if [[ "$response" == *'"status":"UP"'* ]]; then
              echo "🍺 gateway-service 정상 실행 확인!"
              exit 0
            else
              echo "⏳ gateway-service 실행 대기... ($i/20)"
              sleep 3
            fi
          done
          echo "❌ gateway-service가 60초 동안 정상 실행되지 않음..."
          exit 1

      - name: Dump container logs on failure
        if: failure()
        uses: ./.github/actions/dump-service-logs
        with:
          service: gateway-service

      - name: Set deploy result
        if: always()
        id: deploy-result
        run: |
          echo "gateway_service_deploy_result=fail" >> $GITHUB_OUTPUT
          if [[ ${{ steps.start-new-server-application.outcome }} == "success" ]]; then
          echo "gateway_service_deploy_result=success" >> $GITHUB_OUTPUT
          fi

  member-service-deploy:
    needs: [ member-service-image-build ]
    if: needs.member-service-image-build.outputs.member_service_image_build_result == 'success'
    runs-on: groovid-app-ec2-runner
    continue-on-error: true
    outputs:
      member_service_deploy_result: ${{ steps.deploy-result.outputs.member_service_deploy_result }}
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7

      - name: Login to Github Container Registry
        uses: docker/login-action@v3.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Create secret file
        uses: ./.github/actions/prepare-deploy-files
        with:
          service: member-service
          secret-body: |
            PORT_NUMBER=8080
            DB_URL=${{ secrets.MEMBER_DB_URL }}
            DB_USER_NAME=${{ secrets.MEMBER_DB_USER_NAME }}
            DB_PASSWORD=${{ secrets.MEMBER_DB_PASSWORD }}

            ACCESS_TOKEN_SECRET_KEY=${{ secrets.ACCESS_TOKEN_SECRET_KEY }}
            REFRESH_TOKEN_SECRET_KEY=${{ secrets.REFRESH_TOKEN_SECRET_KEY }}
            ACCESS_TOKEN_EXPIRATION_TIME=${{ secrets.ACCESS_TOKEN_EXPIRATION_TIME }}
            REFRESH_TOKEN_EXPIRATION_TIME=${{ secrets.REFRESH_TOKEN_EXPIRATION_TIME }}

      - name: Start new server application
        id: start-new-server-application
        run: |
          cd ~/project
          sudo docker-compose stop member-service || true
          sudo docker-compose rm -f member-service || true
          sudo docker-compose up -d member-service
          
          echo "🔍 member-service 헬스 체크 확인 중..."
          for i in {1..20}; do
            response=$(curl -s http://localhost:8081/member-service/actuator/health || true)
            if [[ "$response" == *'"status":"UP"'* ]]; then
              echo "🍺 member-service 정상 실행 확인!"
              exit 0
            else
              echo "⏳ member-service 실행 대기... ($i/20)"
              sleep 3
            fi
          done
          echo "❌ member-service가 60초 동안 정상 실행되지 않음..."
          exit 1

      - name: Dump container logs on failure
        if: failure()
        uses: ./.github/actions/dump-service-logs
        with:
          service: member-service

      - name: Set deploy result
        if: always()
        id: deploy-result
        run: |
          echo "member_service_deploy_result=fail" >> $GITHUB_OUTPUT
          if [[ ${{ steps.start-new-server-application.outcome }} == "success" ]]; then
          echo "member_service_deploy_result=success" >> $GITHUB_OUTPUT
          fi

  product-service-deploy:
    needs: [ product-service-image-build ]
    if: needs.product-service-image-build.outputs.product_service_image_build_result == 'success'
    runs-on: groovid-app-ec2-runner
    continue-on-error: true
    outputs:
      product_service_deploy_result: ${{ steps.deploy-result.outputs.product_service_deploy_result }}
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7

      - name: Login to Github Container Registry
        uses: docker/login-action@v3.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Create secret file
        uses: ./.github/actions/prepare-deploy-files
        with:
          service: product-service
          secret-body: |
            PORT_NUMBER=8080
            DB_URL=${{ secrets.PRODUCT_DB_URL }}
            DB_USER_NAME=${{ secrets.PRODUCT_DB_USER_NAME }}
            DB_PASSWORD=${{ secrets.PRODUCT_DB_PASSWORD }}

            KAFKA_BOOTSTRAP_SERVERS=${{ secrets.KAFKA_BOOTSTRAP_SERVERS }}
            AUCTION_SERVICE_BASE_URL=${{ secrets.AUCTION_SERVICE_BASE_URL }}

      - name: Start new server application
        id: start-new-server-application
        run: |
          cd ~/project
          sudo docker-compose stop product-service || true
          sudo docker-compose rm -f product-service || true
          sudo docker-compose up -d product-service
          
          echo "🔍 product-service 헬스 체크 확인 중..."
          for i in {1..20}; do
            response=$(curl -s http://localhost:8084/product-service/actuator/health || true)
            if [[ "$response" == *'"status":"UP"'* ]]; then
              echo "🍺 product-service 정상 실행 확인!"
              exit 0
            else

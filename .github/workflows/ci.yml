name: CI

on:
  pull_request:
    branches: [ dev, main ]
  push:
    branches: [ dev, main ]

# 머지 후에도 전체 빌드를 한 번 더 돌린다.
# 각 PR은 단독으로 통과했는데 합쳐지는 순간 깨지는 변경(서로 다른 PR이 같은 타입을
# 다르게 바꾸는 경우)은 PR 검사만으로는 잡히지 않기 때문이다.

concurrency:
  # 같은 PR에 연속으로 푸시하면 이전 검사는 취소하고 최신 것만 돌린다.
  # dev/main 머지 후 검사는 취소하지 않는다 - 어느 커밋에서 깨졌는지 기록이 남아야 한다.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: JDK 21 설치
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 준비 (캐시 + wrapper 검증)
        uses: gradle/actions/setup-gradle@v6
        with:
          # PR에서는 캐시를 읽기만 한다. 모든 PR이 캐시를 쓰면 용량이 금방 차고
          # 서로 덮어써서 오히려 느려진다. 캐시 갱신은 dev/main 머지 때만.
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: 빌드 + 테스트
        # integration 태그가 붙은 테스트는 실행에 MySQL이 필요해 CI에서 제외한다.
        # CI 러너에는 DB가 없다. 제외된 테스트는 당분간 로컬에서만 검증된다 (이슈 #99)
        run: ./gradlew build --parallel -PexcludeTags=integration

      - name: 테스트 리포트 업로드
        # 실패했을 때 어느 테스트가 왜 깨졌는지 받아볼 수 있어야 하므로 항상 올린다.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/test'
          retention-days: 7
          if-no-files-found: ignore

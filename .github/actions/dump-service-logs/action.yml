name: Dump service logs
description: >
  배포에 실패한 서비스의 컨테이너 상태와 로그를 워크플로 로그에 남긴다.
  실패 원인을 보려고 EC2에 직접 들어가지 않아도 되게 하기 위함.

inputs:
  service:
    description: '로그를 확인할 서비스 이름 (예: auction-service)'
    required: true
  tail:
    description: >
      출력할 로그 줄 수(최근 200줄)
    required: false
    default: '200'

runs:
  using: composite
  steps:
    - name: Dump container status and logs
      shell: bash
      env:
        SERVICE: ${{ inputs.service }}
        TAIL: ${{ inputs.tail }}
      run: |
        cd ~/project

        echo "::group::${SERVICE} 컨테이너 상태"
        sudo docker-compose ps "$SERVICE" || true
        echo "::endgroup::"

        echo "::group::${SERVICE} 로그 (마지막 ${TAIL}줄)"
        sudo docker-compose logs --tail="$TAIL" --no-color "$SERVICE" || true
        echo "::endgroup::"

server:
  port: ${PORT_NUMBER}
  tomcat:
    mbeanregistry:
      enabled: true

spring:
  Jackson:
    mapper:
      SORT_PROPERTIES_ALPHABETICALLY: false

  application:
    name: member-service

  profiles:
    active: local

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MEMBER_DB_URL}
    username: ${DB_USER_NAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health
      base-path: /member-service/actuator

app:
  jwt:
    access-token-secret-key: ${ACCESS_TOKEN_SECRET_KEY}
    refresh-token-secret-key: ${REFRESH_TOKEN_SECRET_KEY}
    access-token-expiration-time: ${ACCESS_TOKEN_EXPIRATION_TIME}
    refresh-token-expiration-time: ${REFRESH_TOKEN_EXPIRATION_TIME}

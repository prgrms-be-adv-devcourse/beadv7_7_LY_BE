server:
  port: ${PORT_NUMBER}
  tomcat:
    mbeanregistry:
      enabled: true

spring:
  Jackson:
    mapper:
      SORT_PROPERTIES_ALPHABETICALLY: false

  application:
    name: member-service

  profiles:
    active: local

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USER_NAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.trusted.packages: site.common.event.contract
    listener:
      ack-mode: batch

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health
      base-path: /member-service/actuator

app:
  jwt:
    access-token-secret-key: ${ACCESS_TOKEN_SECRET_KEY}
    refresh-token-secret-key: ${REFRESH_TOKEN_SECRET_KEY}
    access-token-expiration-time: ${ACCESS_TOKEN_EXPIRATION_TIME}
    refresh-token-expiration-time: ${REFRESH_TOKEN_EXPIRATION_TIME}
  aws:
    kms:
      region: ${AWS_KMS_REGION:}
      key-id: ${AWS_KMS_KEY_ID:}
      hmac-key-id: ${AWS_KMS_HMAC_KEY_ID:}

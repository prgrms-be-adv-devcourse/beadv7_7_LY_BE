name: lp-auction-local

services:
  mysql:
    image: mysql:8.0
    ports:
      - "33340:3306"
    # 서버 설정은 command로 준다 — my.cnf 마운트만으로는 환경에 따라 반영이 안 되기 때문이다.
    # 윈도우/WSL에서는 마운트된 파일이 777 권한으로 잡히는데, MySQL은 "누구나 쓸 수 있는
    # 설정 파일"을 보안상 통째로 무시한다("World-writable config file ... is ignored").
    # charset이 우연히 기본값과 같아 한참 모르고 지나갔지만, 기본값과 다른 값을 넣는 순간
    # "적용했다고 믿고 실제로는 안 먹은" 상태가 된다. command는 마운트 권한과 무관하다.
    #
    # my.cnf도 그대로 둔다. [client]·[mysql] 섹션은 컨테이너 안 mysql CLI의 기본 charset이라
    # 서버 옵션인 command로는 대신할 수 없고, 마운트가 정상인 환경(mac/리눅스)에서는 실제로 쓰인다.
    # 겹치는 [mysqld] 값은 command가 이기므로(명령행 > 설정파일) 충돌하지 않는다.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # 검색 성능 측정용. 기본값은 128M이고, 상품 수십만 건을 다루면 디스크 I/O가 결과를 지배한다.
      # 운영 환경(t3.large)은 기본값 128M을 쓰므로, 운영 재현 측정을 할 때는 이 줄을 128M으로 낮춘다.
      - --innodb-buffer-pool-size=1G
    environment:
      TZ: Asia/Seoul
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lp_auction
    volumes:
      - mysql-data:/var/lib/mysql
      - ./volumes/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot" ]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    ports:
      - "81:80"
    environment:
      TZ: Asia/Seoul
    volumes:
      - ./volumes/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  kafka:
    image: apache/kafka:4.2.1
    ports:
      - "9092:9092"
    environment:
      TZ: Asia/Seoul
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT: 호스트(core-service 등 컨테이너 밖)용, INTERNAL: 같은 도커 네트워크 안
      # 컨테이너(kafka-ui 등)용 — "localhost" advertise는 컨테이너 안에서는 자기 자신을
      # 가리켜서 안 통하기 때문에 리스너를 나눴다.
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    ports:
      - "8089:8080"
    environment:
      TZ: Asia/Seoul
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka

  elasticsearch:
    build:
      context: ./elasticsearch
    image: lp-auction-elasticsearch:9.4.2
    ports:
      - "9200:9200"
    environment:
      TZ: Asia/Seoul
      # 단일 노드라 다른 노드를 찾는 클러스터 구성 단계를 건너뛴다.
      discovery.type: single-node
      # ES 8부터 인증이 기본 켜짐이라, 로컬에서 http://localhost:9200 에 그냥 붙으려면
      # 명시적으로 꺼야 한다. 운영에 이 설정을 그대로 가져가면 안 된다.
      xpack.security.enabled: "false"
      # heap 기본값은 컨테이너 가용 메모리에 맞춰 자동 산정된다. mysql·kafka와 같이 뜨는
      # 로컬 환경이라 작게 고정한다.
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -s -f http://localhost:9200/_cluster/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10

  kibana:
    image: docker.elastic.co/kibana/kibana:9.4.2
    ports:
      - "5601:5601"
    environment:
      TZ: Asia/Seoul
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy

  redis:
    image: redis:7.4
    # 락+캐시 혼용. noeviction으로 락 키가 evict되는 걸 막는다(캐시 쓰기 실패는 감수). 운영값과 동일.
    command: [ "redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction" ]
    mem_limit: 640m
    ports:
      - "6379:6379"
    environment:
      TZ: Asia/Seoul
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  # 볼륨 이름을 명시한다. 안 적으면 "<프로젝트명>_mysql-data"가 되는데,
  # 예전에 mysql만 다른 프로젝트명(-p lp-auction-local-mysql)으로 띄운 적이 있어
  # 실제 데이터가 그 이름의 볼륨에 들어 있다. 이름을 고정해 두면 프로젝트명이 무엇이든
  # 같은 볼륨을 쓰므로, 다시 띄울 때 빈 DB가 되는 사고를 막는다.
  mysql-data:
    name: lp-auction-local-mysql_mysql-data
  kafka-data:
  elasticsearch-data:
  redis-data:

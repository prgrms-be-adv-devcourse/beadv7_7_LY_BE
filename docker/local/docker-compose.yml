name: lp-auction-local

services:
  mysql:
    image: mysql:8.0
    ports:
      - "33340:3306"
    environment:
      TZ: Asia/Seoul
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lp_auction
    volumes:
      - mysql-data:/var/lib/mysql
      - ./volumes/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot" ]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    ports:
      - "81:80"
    environment:
      TZ: Asia/Seoul
    volumes:
      - ./volumes/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  kafka:
    image: apache/kafka:4.2.1
    ports:
      - "9092:9092"
    environment:
      TZ: Asia/Seoul
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT: 호스트(core-service 등 컨테이너 밖)용, INTERNAL: 같은 도커 네트워크 안
      # 컨테이너(kafka-ui 등)용 — "localhost" advertise는 컨테이너 안에서는 자기 자신을
      # 가리켜서 안 통하기 때문에 리스너를 나눴다.
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    ports:
      - "8089:8080"
    environment:
      TZ: Asia/Seoul
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
    ports:
      - "9200:9200"
    environment:
      TZ: Asia/Seoul
      # 단일 노드라 다른 노드를 찾는 클러스터 구성 단계를 건너뛴다.
      discovery.type: single-node
      # ES 8부터 인증이 기본 켜짐이라, 로컬에서 http://localhost:9200 에 그냥 붙으려면
      # 명시적으로 꺼야 한다. 운영에 이 설정을 그대로 가져가면 안 된다.
      xpack.security.enabled: "false"
      # heap 기본값은 컨테이너 가용 메모리에 맞춰 자동 산정된다. mysql·kafka와 같이 뜨는
      # 로컬 환경이라 작게 고정한다.
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -s -f http://localhost:9200/_cluster/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
  kafka-data:
  elasticsearch-data:

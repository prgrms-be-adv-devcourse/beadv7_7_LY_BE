# 로컬은 7개 서비스가 전부 개발자 PC 한 대에서 gradlew bootRun으로 뜬다(Docker 컨테이너가 아님) —
# 그래서 컨테이너 안에서 호스트를 가리키는 특수 DNS인 host.docker.internal로 스크레이프한다.
# 포트는 각 서비스 application-local.yml 기준 실측치.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: 'gateway-service'
    metrics_path: '/gateway-service/actuator/prometheus'
    static_configs:
      - targets: [ 'host.docker.internal:8080' ]
        labels: { service: 'gateway-service', env: 'local' }

  - job_name: 'member-service'
    metrics_path: '/member-service/actuator/prometheus'
    static_configs:
      - targets: [ 'host.docker.internal:8081' ]
        labels: { service: 'member-service', env: 'local' }

  - job_name: 'fulfillment-service'
    metrics_path: '/fulfillment-service/actuator/prometheus'
    static_configs:
      - targets: [ 'host.docker.internal:8083' ]
        labels: { service: 'fulfillment-service', env: 'local' }

  - job_name: 'product-service'
    metrics_path: '/product-service/actuator/prometheus'
    static_configs:
      - targets: [ 'host.docker.internal:8084' ]
        labels: { service: 'product-service', env: 'local' }

  - job_name: 'auction-service'
    metrics_path: '/auction-service/actuator/prometheus'
    static_configs:
      - targets: [ 'host.docker.internal:8085' ]
        labels: { service: 'auction-service', env: 'local' }

  - job_name: 'pointwallet-service'
    metrics_path: '/pointwallet-service/actuator/prometheus'
    static_configs:
      - targets: [ 'host.docker.internal:8086' ]
        labels: { service: 'pointwallet-service', env: 'local' }

  - job_name: 'exploration-service'
    metrics_path: '/exploration-service/actuator/prometheus'
    static_configs:
      - targets: [ 'host.docker.internal:8087' ]
        labels: { service: 'exploration-service', env: 'local' }

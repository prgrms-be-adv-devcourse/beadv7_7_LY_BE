apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-1m'
        spanEndTimeShift: '1m'
        filterByTraceID: true

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        # docker/prod와 동일 — Spring Boot 기본 콘솔 로그 상관관계 패턴 "[traceId,spanId]"에 맞춘 정규식
        - datasourceUid: tempo
          matcherRegex: '\[([0-9a-f]{32}),[0-9a-f]{16}\]'
          name: TraceID
          url: '$${__value.raw}'

# `name:`을 일부러 안 둔다 — docker-compose.yml과 항상 같이(`-f docker-compose.yml -f docker-compose.alloy.yml`)
# 쓰는 파일이라, 여기서 별도 이름을 주면 병합 시 프로젝트명이 이 파일 것으로 덮여써서
# (Compose 병합 규칙상 나중 파일의 top-level `name`이 우선) 네트워크명(`lp-auction-local_default`)이
# 매번 바뀌어버린다. docker-compose.yml의 `name: lp-auction-local`을 그대로 물려받게 비워둔다.

# infra EC2/app EC2 구조를 로컬에서도 그대로 재현한다 — "이번에 새로 추가되는 것 중 app EC2에
# 해당하는 것"만 별도 compose 파일로 뺀 것(운영은 docker/prod/docker-compose.alloy.yml).
#
# Alloy는 Docker 컨테이너 로그만 본다. 로컬 7개 서비스는 평소 gradlew bootRun(호스트 프로세스)이라
# 이 상태로는 discovery 대상이 없다 — 검증하려는 서비스를 실제로 컨테이너화해서 같은 네트워크에
# 붙여야 동작을 확인할 수 있다.
#
# 실행(관측 스택 전체 + alloy):
#   cd docker/local
#   docker compose -f docker-compose.yml -f docker-compose.alloy.yml up -d prometheus grafana tempo loki alloy

services:
  alloy:
    image: grafana/alloy:v1.18.1
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "12345:12345"
    depends_on:
      - loki

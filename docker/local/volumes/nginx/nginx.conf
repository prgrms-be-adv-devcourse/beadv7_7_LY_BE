events {
    worker_connections 1024;
}

http {
    upstream core_service {
        server host.docker.internal:8080;
    }

    upstream auth_service {
        server host.docker.internal:8081;
    }

    # 회원 서비스는 나중에 분리될 수 있음
    upstream member_service {
        server host.docker.internal:8081;
    }

    map $request_uri $is_auth_required {
        default "on";

        # --- 화이트리스트 목록 (인증 제외 API) ---
        ~^/internal                     "off";
        ~^/api/v[0-9]+/auth/login       "off";
        ~^/api/v[0-9]+/members$         "off";
    }

    # 브라우저 출처 허용 목록
    # 프론트가 백엔드 주소를 직접 부르는 방식이라, 여기 없는 곳에서 온 요청은 브라우저가 응답을 버린다.
    # 값이 빈 문자열이면 허용 헤더 자체를 안 붙인다 = 허용하지 않음
    map $http_origin $cors_origin {
        default                     "";

        "http://localhost:5173"     $http_origin;   # 로컬 개발 서버
    }

    map $request_uri $target_upstream {
        default http://core_service;

        # 주의: /members로 시작하지만 회원 서비스 소속이 아닌 경로들.
        # 관심 경매·찜은 코어 서비스(경매/상품 도메인) 기능인데 URL만 /members/me 아래에 있다.
        # 정규식은 위에서부터 검사하므로, 이 두 줄이 아래의 members 포괄 규칙보다 먼저 있어야 한다.
        # 순서가 뒤집히면 코어로 가야 할 요청이 회원 서비스로 가서 404(GERR-0002)가 난다.
        ~^/api/v[0-9]+/members/me/watched-auctions        http://core_service;
        ~^/api/v[0-9]+/members/me/liked-products          http://core_service;

        ~^/api/v[0-9]+/members(?|/|$)                     http://member_service;
        ~^/internal/v[0-9]+/members(?|/|$)                http://member_service;
        ~^/api/v[0-9]+/auth(?|/|$)                        http://auth_service;
        ~^/internal/v[0-9]+/auth(?|/|$)                   http://auth_service;
    }

    server {
        listen 80;
        server_name localhost;

        set $auth_validate_uri /internal/v1/auth/validate-token;

        # 경매 등록은 사진을 문자열로 바꿔 요청 본문에 담아 보낸다(3장이면 1MB 안팎).
        # 기본값 1MB에 걸리면 등록이 413으로 떨어진다
        client_max_body_size 10m;

        # --------------------------------------------------------
        # 1. 인증이 필요한 API
        # --------------------------------------------------------
        location / {
            # 브라우저는 본 요청 전에 "이런 요청 보내도 되냐"는 확인 요청(OPTIONS)을 먼저 보내는데,
            # 이 요청에는 로그인 정보가 실리지 않는다. 아래 auth_request를 그대로 태우면 401이 나고
            # 본 요청은 시작조차 못 한다 — 그래서 확인 요청은 여기서 바로 답하고 끝낸다
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
                add_header Access-Control-Max-Age 600 always;
                add_header Content-Length 0 always;
                return 204;
            }

            # 성공이든 실패든 이 헤더가 있어야 브라우저가 응답 내용을 화면에 넘겨준다.
            # 없으면 401·400도 브라우저가 통째로 버려서 "왜 실패했는지"조차 안 보인다
            add_header Access-Control-Allow-Origin $cors_origin always;

            auth_request /internal/auth-check;

            auth_request_set $member_id $upstream_http_x_member_id;
            error_page 401 403 = @auth_unauthorized;

            proxy_pass $target_upstream;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Member-Id $member_id;
            proxy_set_header Authorization "";
        }

        # --------------------------------------------------------
        # 2. Nginx 내부용 인증 처리 경로 (외부 직접 접근 불가)
        # --------------------------------------------------------
        location = /internal/auth-check {
            internal;

            if ($is_auth_required = "off") {
                return 200;
            }

            # 토큰이 아예 없는 요청은 검증 없이 통과시킨다 (비로그인 손님).
            # 메인 화면의 경매·상품 목록처럼 로그인 없이도 열려야 하는 API가 있는데,
            # 그 목록을 여기 화이트리스트로 관리하면 공개 API가 늘 때마다 nginx도
            # 같이 고쳐야 하고, 빼먹으면 비로그인 화면이 통째로 깨진다.
            # 그래서 "로그인이 필수인 API인지"는 백엔드가 판단하게 두고,
            # 게이트웨이는 토큰이 실려온 경우의 진위 확인만 맡는다.
            # 통과시켜도 X-Member-Id가 빈 값이라 헤더 자체가 안 실리므로,
            # 회원 전용 API는 백엔드에서 401로 걸러진다. 신원을 속일 방법은 없다.
            # 토큰을 들고 왔는데 틀리거나 만료된 경우는 지금처럼 아래 검증에서 401.
            if ($http_authorization = "") {
                return 200;
            }

            proxy_pass http://auth_service$auth_validate_uri;

            proxy_pass_request_headers on;
            proxy_pass_request_body off;
            proxy_set_header Host $host;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
        }

        location @auth_unauthorized {
            # 401 응답에도 허용 헤더가 필요하다 — 없으면 브라우저가 "인증 실패"를 보여주지 못하고
            # 출처 오류로 뭉개서, 토큰이 만료된 건지 설정이 틀린 건지 구분할 수 없게 된다
            add_header Access-Control-Allow-Origin $cors_origin always;

            rewrite ^ $auth_validate_uri break;

            # 인증 모듈로 직접 요청을 포워딩하여 인증 모듈이 생성한 에러 JSON/Body를 그대로 응답함
            proxy_pass http://auth_service;

            proxy_pass_request_headers on;
            proxy_set_header Host $host;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }
    }
}

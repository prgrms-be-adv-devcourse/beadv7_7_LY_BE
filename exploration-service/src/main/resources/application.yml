server:
  port: ${PORT_NUMBER}
  tomcat:
    mbeanregistry:
      enabled: true

spring:
  application:
    name: exploration-service

  profiles:
    active: local

  # common이 spring-boot-starter-data-jpa를 api 의존성으로 노출해서, DB를 쓰지 않는
  # 이 모듈에도 JPA가 클래스패스에 딸려온다. 그대로 두면 DataSource 자동설정이 켜지고
  # url이 없다며 기동에 실패하므로 명시적으로 끈다.
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS}

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health
      base-path: /api/actuator

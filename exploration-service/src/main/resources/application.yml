server:
  port: ${PORT_NUMBER}
  tomcat:
    mbeanregistry:
      enabled: true

spring:
  application:
    name: exploration-service

  profiles:
    active: local

  # common이 spring-boot-starter-data-jpa를 api 의존성으로 노출해서, DB를 쓰지 않는
  # 이 모듈에도 JPA가 클래스패스에 딸려온다. 그대로 두면 DataSource 자동설정이 켜지고
  # url이 없다며 기동에 실패하므로 명시적으로 끈다.
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS}

  ai:
    # OpenAI 스타터는 챗·임베딩뿐 아니라 이미지·오디오·모더레이션 모델까지 전부 자동설정한다.
    # 쓰지도 않는 빈이 뜨는 것도 문제지만, 이 빈들이 기동 시점에 API 키를 요구해서
    # 컨텍스트가 아예 안 뜬다. 필요한 둘만 남기고 끈다.
    model:
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

    openai:
      api-key: ${OPENAI_API_KEY}
      embedding:
        model: text-embedding-3-large
        dimensions: 1024

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health
      base-path: /api/actuator

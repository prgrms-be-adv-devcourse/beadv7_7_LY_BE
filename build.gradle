plugins {
    // 루트에서는 버전만 등록하고(apply false), 실제 적용은 각 모듈에서 한다.
    id 'org.springframework.boot' version '4.1.0' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

allprojects {
    group = 'site'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    // Boot 플러그인을 적용하지 않은 모듈(common)도
    // Spring Boot BOM으로 의존성 버전을 통일해서 관리한다.
    dependencyManagement {
        imports {
            mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:2025.1.2"
            // common이 쓰는 AWS SDK(KMS)의 버전을 여기서 통일한다. BOM import는 선언한
            // 프로젝트에만 적용되고 의존 프로젝트로 전파되지 않아서, common에만 넣으면
            // common을 쓰는 서비스의 runtimeClasspath에서 버전을 못 찾아 빌드가 깨진다.
            mavenBom "software.amazon.awssdk:bom:2.53.3"
        }
    }

    // 모든 모듈이 공통으로 쓰는 것만 여기에 ex) Lombok
    dependencies {
        // Lombok
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'

        // Spring Actuator
        implementation 'org.springframework.boot:spring-boot-starter-actuator'

        // Prometheus
        implementation 'io.micrometer:micrometer-registry-prometheus'

        // Kafka
        implementation 'org.springframework.boot:spring-boot-starter-kafka'
        testImplementation 'org.springframework.boot:spring-boot-starter-kafka-test'

        // Junit
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    // 소스 파일은 UTF-8로 저장돼 있는데, 인코딩을 지정하지 않으면 컴파일러가 OS 기본값을 쓴다.
    // 한국어 윈도우에서는 그 기본값이 CP949(x-windows-949)라 한글 주석을 읽다가 빌드가 깨진다.
    // 리눅스·맥은 기본값이 UTF-8이라 멀쩡해서, 쓰는 OS에 따라 되고 안 되고가 갈린다.
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.named('test') {
        // 테스트가 찍는 한글(실패 메시지·@DisplayName)도 같은 이유로 깨진다
        systemProperty 'file.encoding', 'UTF-8'

        useJUnitPlatform {
            // 로컬에 띄운 MySQL이 있어야 도는 테스트에는 @Tag("integration")을 붙여둔다.
            // CI 러너에는 DB가 없으므로 -PexcludeTags=integration 으로 걸러낸다.
            // 옵션을 주지 않으면(= 로컬 실행) 아무것도 제외하지 않고 전부 실행된다.
            if (project.hasProperty('excludeTags')) {
                excludeTags project.property('excludeTags').split(',')
            }
        }
    }
}

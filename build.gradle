plugins {
    // 루트에서는 버전만 등록하고(apply false), 실제 적용은 각 모듈에서 한다.
    id 'org.springframework.boot' version '4.1.0' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

allprojects {
    group = 'site'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    // Boot 플러그인을 적용하지 않은 모듈(common)도
    // Spring Boot BOM으로 의존성 버전을 통일해서 관리한다.
    dependencyManagement {
        imports {
            mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
        }
    }

    // 모든 모듈이 공통으로 쓰는 것만 여기에 ex) Lombok
    dependencies {
        // Lombok
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'

        // Spring Actuator
        implementation 'org.springframework.boot:spring-boot-starter-actuator'

        // Prometheus
        implementation 'io.micrometer:micrometer-registry-prometheus'

        // Junit
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.named('test') {
        useJUnitPlatform {
            // 로컬에 띄운 MySQL이 있어야 도는 테스트에는 @Tag("integration")을 붙여둔다.
            // CI 러너에는 DB가 없으므로 -PexcludeTags=integration 으로 걸러낸다.
            // 옵션을 주지 않으면(= 로컬 실행) 아무것도 제외하지 않고 전부 실행된다.
            if (project.hasProperty('excludeTags')) {
                excludeTags project.property('excludeTags').split(',')
            }
        }
    }
}
